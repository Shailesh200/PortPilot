name: Release

on:
  push:
    branches: [main]

jobs:
  bump:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump patch version
        id: bump
        run: |
          NEW_VERSION=$(npm version patch --no-git-tag-version | sed 's/^v//')
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped to v${NEW_VERSION}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push
          git push --tags

  release-mac:
    needs: bump
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build app
        run: |
          rm -rf out
          npm run build

      - name: Build and publish macOS artifacts
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

  release-win:
    needs: bump
    runs-on: windows-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          npm ci 2>&1 | tee win-install.log
          # npm ci can skip platform optional deps (npm/cli#4828); rollup needs the Windows native binding.
          npm install --no-save @rollup/rollup-win32-x64-msvc 2>&1 | tee -a win-install.log

      - name: Typecheck
        shell: bash
        run: npm run typecheck 2>&1 | tee win-typecheck.log

      - name: Build app
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          rm -rf out
          npm run build 2>&1 | tee win-build.log
          exit ${PIPESTATUS[0]}

      - name: Publish Windows build failure details
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const parts = [];
            for (const file of ['win-install.log', 'win-typecheck.log', 'win-build.log']) {
              if (!fs.existsSync(file)) continue;
              const body = fs.readFileSync(file, 'utf8').slice(-12000);
              parts.push(`### ${file}\n\`\`\`\n${body}\n\`\`\``);
            }
            if (!parts.length) {
              parts.push('_No diagnostic log files were produced._');
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `ci: Windows release failed (${context.sha.slice(0, 7)})`,
              body: [
                `Automated report from [\`${context.workflow}\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
                '',
                ...parts
              ].join('\n')
            });

      - name: Build and publish Windows artifacts
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
