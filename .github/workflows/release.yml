name: Release

on:
  push:
    branches: [main]

jobs:
  bump:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Bump patch version
        id: bump
        run: |
          NEW_VERSION=$(node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const parts = pkg.version.split('.').map(Number);
            parts[2] += 1;
            pkg.version = parts.join('.');
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            process.stdout.write(pkg.version);
          ")
          bun install --lockfile-only
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped to v${NEW_VERSION}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "chore: bump version to v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push
          git push --tags

  release-mac:
    needs: bump
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build app
        run: |
          rm -rf out
          bun run build

      - name: Write Apple notarization API key
        env:
          APPLE_API_KEY_BODY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_FILE="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "$APPLE_API_KEY_BODY" > "$KEY_FILE"
          echo "APPLE_API_KEY=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Build and publish macOS artifacts
        run: bunx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ARDSWV5GD2

  release-win:
    needs: bump
    runs-on: windows-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile 2>&1 | tee win-install.log

      - name: Typecheck
        shell: bash
        run: bun run typecheck 2>&1 | tee win-typecheck.log

      - name: Build app
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          rm -rf out
          bun run build 2>&1 | tee win-build.log
          exit ${PIPESTATUS[0]}

      - name: Publish Windows build failure details
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const parts = [];
            for (const file of ['win-install.log', 'win-typecheck.log', 'win-build.log']) {
              if (!fs.existsSync(file)) continue;
              const body = fs.readFileSync(file, 'utf8').slice(-12000);
              parts.push(`### ${file}\n\`\`\`\n${body}\n\`\`\``);
            }
            if (!parts.length) {
              parts.push('_No diagnostic log files were produced._');
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `ci: Windows release failed (${context.sha.slice(0, 7)})`,
              body: [
                `Automated report from [\`${context.workflow}\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
                '',
                ...parts
              ].join('\n')
            });

      - name: Build and publish Windows artifacts
        run: bunx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
