name: MAS upload

# Builds a Mac App Store .pkg and uploads it with the App Store Connect API
# (same as Transporter). Does not submit for review.
#
# Run from Actions → MAS upload → Run workflow.
# Required secrets (in addition to APPLE_API_KEY / _ID / _ISSUER):
#   MAS_CSC_LINK          base64 .p12 with 3rd Party Mac Developer Application
#                         AND 3rd Party Mac Developer Installer
#   MAS_CSC_KEY_PASSWORD  password for that .p12
#   MAS_PROVISION_PROFILE base64 Mac App Store .provisionprofile

on:
  workflow_dispatch:
    inputs:
      store_version:
        description: 'Connect marketing version (CFBundleShortVersionString). Defaults to package.json version.'
        required: false
        type: string

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Stamp MAS versions
        env:
          MAS_SHORT_VERSION: ${{ inputs.store_version }}
          # Actions expressions have no `+`; stamp-mas-version.cjs adds 1000.
          MAS_BUNDLE_VERSION: ${{ github.run_number }}
        run: node scripts/stamp-mas-version.cjs

      - name: Build renderer/main
        run: |
          rm -rf out
          bun run build

      - name: Import MAS certificates and profile
        env:
          MAS_CSC_LINK_SECRET: ${{ secrets.MAS_CSC_LINK }}
          MAS_CSC_KEY_PASSWORD: ${{ secrets.MAS_CSC_KEY_PASSWORD }}
          MAS_PROVISION_B64: ${{ secrets.MAS_PROVISION_PROFILE }}
        run: |
          set -euo pipefail
          if [ -z "${MAS_CSC_LINK_SECRET:-}" ] || [ -z "${MAS_CSC_KEY_PASSWORD:-}" ]; then
            echo "Add GitHub secrets MAS_CSC_LINK and MAS_CSC_KEY_PASSWORD (MAS .p12, not Developer ID)." >&2
            exit 1
          fi
          if [ -z "${MAS_PROVISION_B64:-}" ]; then
            echo "Add GitHub secret MAS_PROVISION_PROFILE (base64 of the Mac App Store .provisionprofile)." >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/private_keys"
          export CSC_LINK_SECRET="$MAS_CSC_LINK_SECRET"
          export P12_FILE="$RUNNER_TEMP/private_keys/mas.p12"
          python3 scripts/decode-csc-link.py

          python3 -c "
          import base64, os, pathlib
          raw = os.environ['MAS_PROVISION_B64']
          pathlib.Path('build/embedded.provisionprofile').write_bytes(base64.b64decode(''.join(raw.split())))
          "

          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" \
            https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer

          KEYCHAIN="$RUNNER_TEMP/mas.keychain-db"
          KC_PASS=$(uuidgen)
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN" -A
          security import "$P12_FILE" -k "$KEYCHAIN" -P "$MAS_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          echo "MAS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "MAS_KEYCHAIN_PASSWORD=$KC_PASS" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Package MAS .pkg
        run: |
          security unlock-keychain -p "$MAS_KEYCHAIN_PASSWORD" "$MAS_KEYCHAIN"
          bun run dist:mas
        env:
          MAS_KEYCHAIN: ${{ env.MAS_KEYCHAIN }}
          MAS_KEYCHAIN_PASSWORD: ${{ env.MAS_KEYCHAIN_PASSWORD }}

      - name: Upload pkg to App Store Connect
        env:
          APPLE_API_KEY_BODY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          PKG=$(find dist -name '*.pkg' | head -1)
          if [ -z "$PKG" ]; then
            echo "No .pkg in dist/" >&2
            ls -la dist || true
            exit 1
          fi
          echo "Uploading $PKG"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          export KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          python3 -c 'import os, pathlib; b=os.environ["APPLE_API_KEY_BODY"].replace("\\n","\n"); p=pathlib.Path(os.environ["KEY"]); p.write_text(b if b.endswith("\n") else b+"\n")'
          xcrun altool --upload-app --type macos --file "$PKG" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER"

      - name: Upload MAS builder log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mas-dist
          path: |
            dist/**/*.pkg
          if-no-files-found: ignore
